services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: retake
      POSTGRES_PASSWORD: retake
      POSTGRES_DB: retake
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retake"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: uv run uvicorn retake.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retake:retake@postgres:5432/retake
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
    volumes: [./apps/api:/app/apps/api]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: uv run arq retake.jobs.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retake:retake@postgres:5432/retake
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
    volumes: [./apps/api:/app/apps/api]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    command: npm run dev -- --host
    volumes: [./apps/web:/app/apps/web, /app/apps/web/node_modules]
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
  miniodata:
