[project]
name = "retake"
version = "0.1.0"
description = "QA and surgical regeneration for AI-narrated audiobooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "arq",
    "httpx",
    "pydantic-settings",
    "structlog",
    "pysbd==0.3.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retake"]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear (mutable defaults, etc.)
    "UP",       # pyupgrade (modern syntax)
    "ASYNC",    # blocking calls in async code
    "DTZ",      # naive datetimes
    "T20",      # print statements
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# RUF001: tests deliberately contain curly quotes, dashes and ellipses as test data.
"tests/**" = ["T20", "RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["retake"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "pysbd"
ignore_missing_imports = true  # pysbd ships no type hints (ADR-0004)

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "external: calls a paid external API; skipped unless RUN_EXTERNAL=1",
]
addopts = "-m 'not external'"
